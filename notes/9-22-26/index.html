<html>
    <head>
        <title>9-22-26</title>
    </head>
    <style>
        #pokemonDiv{
            background-color: red;
            display: flex;
        }
        #pokemonImage{
            background-color: ghostwhite;
            border-color: red;
            border;
            border-radius: 20px;
        }
    </style>
    <body>

        <div id = "root">


        </div>

        <script>
            let rootDiv = document.querySelector("#root");
            // Pokemon Data
            let allPokemon = [];
            let pokemon = {};
            pokemon.name = "pikachu";
            pokemon.description = "the lightning one";
            pokemon.img = "https://img.pokemondb.net/sprites/ruby-sapphire/normal/pikachu.png";
            allPokemon.push(pokemon);

            allPokemon.push({
                name: "torchic",
                description: "fire chicken",
                img:"https://img.pokemondb.net/sprites/ruby-sapphire/normal/torchic.png"
            });

            function addPokemonToRoot(pokemon){
                let pokemonDiv = document.createElement("div")
                pokemonDiv.id="pokemonDiv"

                let infoDiv = document.createElement("div")
                infoDiv.id = "infoDiv"

                let pokemonImage = document.createElement("img")
                pokemonImage.id = "pokemonImage"
                pokemonImage.src = pokemon.img
                pokemonDiv.append(pokemonImage)

                let nameHeading = document.createElement("h1");
                nameHeading.id = "nameHeading"
                nameHeading.innerHTML = pokemon.name;
                infoDiv.append(nameHeading)

                let descriptionParagraph = document.createElement("p")
                descriptionParagraph.id = "descriptionParagraph"
                descriptionParagraph.innerHTML = pokemon.description;
                infoDiv.append(descriptionParagraph)

                pokemonDiv.append(infoDiv)

                rootDiv.append(pokemonDiv)
            }

            addPokemonToRoot(allPokemon[0])
            addPokemonToRoot(allPokemon[1])

        </script>
    </body>




</html>
